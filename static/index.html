<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; background: #f0f2f5; color: #2d3436; min-height: 100vh; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #f0f2f5; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #017EAD 0%, #4CADD1 20%, #EC8934 40%, #6C5CE7 60%, #00B894 80%, #173963 100%);
  background-size: 100% 500%;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { opacity: 0.8; }

@keyframes aurora {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.header {
  background: linear-gradient(135deg, #0f2744, #173963, #1a5276, #017EAD, #173963, #0f2744);
  background-size: 300% 300%;
  animation: aurora 12s ease infinite;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 50%, rgba(236,137,52,0.12) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 50%, rgba(76,173,209,0.1) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 0%, rgba(1,126,173,0.15) 0%, transparent 40%);
  pointer-events: none;
}

.header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #EC8934, #017EAD, #4CADD1, #EC8934);
  background-size: 200% 100%;
  animation: aurora 8s ease infinite;
}

.metric-row {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr 0.6fr 0.8fr 0.6fr;
  align-items: center;
  padding: 12px 24px;
  cursor: pointer;
  transition: background 0.15s;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.metric-row:hover { background: rgba(1,126,173,0.04); }

.section-block { margin-bottom: 8px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 24px 10px;
}
</style>
</head>

function fmtVal(v, isDollar) {
  if (v == null) return "\u2014";
  if (isDollar) return "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function fmtPct(v) {
  if (v == null) return "";
  return (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
}

function fmtDate(d) {
  if (!d) return "\u2014";
  var dt = new Date(d + "T00:00:00");
  return (dt.getMonth() + 1) + "/" + dt.getDate() + "/" + String(dt.getFullYear()).slice(2);
}

function getStats(entries, sec, cat, f) {
  var rows = entries
    .filter(function(e) { return e.section === sec && e.category === cat; })
    .map(function(e) { return { d: e.date, val: f === "a" ? e.amount : e.value }; })
    .filter(function(r) { return r.val != null; })
    .sort(function(a, b) { return a.d.localeCompare(b.d); });
  if (!rows.length) return null;
  var last = rows[rows.length - 1];
  var y = rows.filter(function(r) { return r.d >= "2026-01-01" && r.d < "2027-01-01"; });
  var avg = y.length ? y.reduce(function(s, r) { return s + r.val; }, 0) / y.length : null;
  return {
    latest: last.val, date: last.d, avg: avg,
    delta: avg && avg !== 0 ? (last.val - avg) / avg : null,
    history: rows, count: rows.length
  };
}

function TrendArrow({ delta }) {
  if (delta == null) return <span style={{ color: "#999", fontSize: "0.85rem" }}>{"\u2014"}</span>;
  var arrow = delta > 0.01 ? "\u25B2" : delta < -0.01 ? "\u25BC" : "\u25B6";
  return (
    <span style={{ fontSize: "0.72rem", fontWeight: 600, color: "#555" }}>
      <span style={{ marginRight: 4 }}>{arrow}</span>{fmtPct(delta)}
    </span>
  );
}

function MetricRow({ sec, card, entries, onDrill }) {
  var isDollar = card.f === "a";
  var st = getStats(entries, sec.id, card.c, card.f);
  var label = card.label || card.c;

  return (
    <div className="metric-row" onClick={function() { onDrill({ sec: sec.id, cat: card.c, f: card.f, label: label }); }}>
      <div style={{ fontSize: "0.82rem", fontWeight: 600, color: "#2d3436" }}>{label}</div>
      <div style={{ fontSize: "1.3rem", fontWeight: 700, color: sec.accent }}>{st ? fmtVal(st.latest, isDollar) : "\u2014"}</div>
      <div style={{ fontSize: "0.72rem", color: "#999" }}>{st ? fmtDate(st.date) : ""}</div>
      <div style={{ fontSize: "0.82rem", color: "#666" }}>{st ? fmtVal(st.avg, isDollar) : ""}</div>
      <div>{st ? <TrendArrow delta={st.delta} /> : null}</div>
    </div>
  );
}

function SectionBlock({ sec, entries, onDrill }) {
  return (
    <div className="section-block">
      <div className="section-header">
        <div style={{ width: 5, height: 32, borderRadius: 3, background: sec.accent }}></div>
        <div>
          <div style={{ fontSize: "1.05rem", fontWeight: 700, color: "#173963" }}>{sec.label}</div>
          <div style={{ fontSize: "0.68rem", color: "#999", marginTop: 1 }}>{sec.cards.length} metrics</div>
        </div>
      </div>

      <div style={{ background: "#fff", borderRadius: 10, margin: "0 16px 0", overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 0.8fr 0.6fr 0.8fr 0.6fr", padding: "8px 24px", borderBottom: "2px solid " + sec.accent + "22" }}>
          <div style={{ fontSize: "0.62rem", fontWeight: 700, color: "#999", textTransform: "uppercase", letterSpacing: "0.8px" }}>Metric</div>
          <div style={{ fontSize: "0.62rem", fontWeight: 700, color: "#999", textTransform: "uppercase", letterSpacing: "0.8px" }}>Latest</div>
          <div style={{ fontSize: "0.62rem", fontWeight: 700, color: "#999", textTransform: "uppercase", letterSpacing: "0.8px" }}>Date</div>
          <div style={{ fontSize: "0.62rem", fontWeight: 700, color: "#999", textTransform: "uppercase", letterSpacing: "0.8px" }}>2026 Avg</div>
          <div style={{ fontSize: "0.62rem", fontWeight: 700, color: "#999", textTransform: "uppercase", letterSpacing: "0.8px" }}>Trend</div>
        </div>
        {sec.cards.map(function(card) {
          return <MetricRow key={(card.label || card.c) + card.f} sec={sec} card={card} entries={entries} onDrill={onDrill} />;
        })}
      </div>
    </div>
  );
}

function DrillView({ drill, entries, onBack }) {
  var isDollar = drill.f === "a";
  var st = getStats(entries, drill.sec, drill.cat, drill.f);
  var secObj = SECTIONS.find(function(s) { return s.id === drill.sec; }) || {};

  if (!st) return (
    <div style={{ padding: 32 }}>
      <button onClick={onBack} style={{ background: "#e8ecf0", border: "none", color: "#333", padding: "8px 18px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit", fontSize: "0.8rem", fontWeight: 600, marginBottom: 16 }}>{"\u2190"} Back</button>
      <div style={{ color: "#999" }}>No data for this metric.</div>
    </div>
  );

  var chartData = st.history.map(function(r) { return { date: fmtDate(r.d), val: r.val }; });
  var allE = entries.filter(function(e) { return e.section === drill.sec && e.category === drill.cat; }).sort(function(a, b) { return b.date.localeCompare(a.date); });

  return (
    <div style={{ padding: "24px 32px", maxWidth: 900, margin: "0 auto" }}>
      <button onClick={onBack} style={{ background: "#e8ecf0", border: "none", color: "#333", padding: "8px 18px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit", fontSize: "0.8rem", fontWeight: 600, marginBottom: 24 }}>{"\u2190"} Back</button>

      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
        <div style={{ width: 5, height: 28, borderRadius: 3, background: secObj.accent || "#017EAD" }}></div>
        <h2 style={{ fontSize: "1.3rem", fontWeight: 700, color: "#173963" }}>{drill.label}</h2>
      </div>
      <p style={{ color: "#999", fontSize: "0.78rem", marginBottom: 28, paddingLeft: 17 }}>{secObj.label}</p>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginBottom: 28 }}>
        {[
          { l: "Latest", v: fmtVal(st.latest, isDollar), sub: fmtDate(st.date), accent: secObj.accent },
          { l: "2026 Average", v: fmtVal(st.avg, isDollar), sub: st.count + " data points", accent: "#017EAD" },
          { l: "Trend", v: st.delta != null ? fmtPct(st.delta) : "\u2014", sub: "vs average", accent: "#EC8934" }
        ].map(function(box) {
          return (
            <div key={box.l} style={{ background: "#fff", borderRadius: 10, padding: "18px 20px", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
              <div style={{ fontSize: "0.65rem", color: "#999", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.8px" }}>{box.l}</div>
              <div style={{ fontSize: "1.8rem", fontWeight: 700, color: box.accent, margin: "8px 0 4px" }}>{box.v}</div>
              <div style={{ fontSize: "0.72rem", color: "#aaa" }}>{box.sub}</div>
            </div>
          );
        })}
      </div>

      <div style={{ background: "#fff", borderRadius: 10, padding: "20px 18px", marginBottom: 24, boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
        <ResponsiveContainer width="100%" height={260}>
          <LineChart data={chartData}>
            <XAxis dataKey="date" tick={{ fontSize: 10, fill: "#999" }} axisLine={{ stroke: "#e8ecf0" }} tickLine={false} interval="preserveStartEnd" />
            <YAxis tick={{ fontSize: 10, fill: "#999" }} axisLine={false} tickLine={false} width={55} tickFormatter={function(v) { return isDollar ? (v >= 1000 ? "$" + (v / 1000).toFixed(0) + "k" : "$" + v) : v; }} />
            <Tooltip
              contentStyle={{ background: "#fff", border: "1px solid #e8ecf0", borderRadius: 8, fontSize: "0.8rem", boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}
              formatter={function(v) { return [fmtVal(v, isDollar), isDollar ? "Amount" : "Count"]; }}
            />
            <Line type="monotone" dataKey="val" stroke={secObj.accent || "#4CADD1"} strokeWidth={2.5} dot={{ fill: secObj.accent || "#4CADD1", r: 3, strokeWidth: 0 }} activeDot={{ r: 5, fill: "#EC8934" }} />
          </LineChart>
        </ResponsiveContainer>
      </div>

      <div style={{ background: "#fff", borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "0.8rem" }}>
          <thead>
            <tr>
              <th style={{ padding: "10px 20px", textAlign: "left", fontWeight: 700, fontSize: "0.68rem", color: "#999", textTransform: "uppercase", letterSpacing: "0.8px", borderBottom: "2px solid #f0f2f5" }}>Date</th>
              <th style={{ padding: "10px 20px", textAlign: "right", fontWeight: 700, fontSize: "0.68rem", color: "#999", textTransform: "uppercase", letterSpacing: "0.8px", borderBottom: "2px solid #f0f2f5" }}>{isDollar ? "Amount" : "Count"}</th>
            </tr>
          </thead>
          <tbody>
            {allE.map(function(e, i) {
              return (
                <tr key={e.id || i} style={{ borderBottom: "1px solid #f8f9fa" }}>
                  <td style={{ padding: "10px 20px", color: "#666" }}>{fmtDate(e.date)}</td>
                  <td style={{ padding: "10px 20px", textAlign: "right", fontWeight: 600, color: "#2d3436" }}>{isDollar ? fmtVal(e.amount, true) : fmtVal(e.value, false)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App() {
  var [entries, setEntries] = useState([]);
  var [loading, setLoading] = useState(true);
  var [tab, setTab] = useState("overview");
  var [drill, setDrill] = useState(null);

  useEffect(function() {
    fetch("/api/entries")
      .then(function(r) { return r.json(); })
      .then(function(data) { setEntries(data); setLoading(false); })
      .catch(function() { setLoading(false); });
  }, []);

  var handleDrill = function(d) { setDrill(d); setTab("drill"); };

  if (loading) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: "#173963", fontSize: "0.9rem", fontWeight: 600 }}>
        Loading dashboard...
      </div>
    );
  }

  var tabs = [{ id: "overview", label: "Overview" }].concat(
    SECTIONS.map(function(s) { return { id: s.id, label: s.label }; })
  );

  return (
    <div style={{ minHeight: "100vh" }}>
      {/* Header */}
      <div className="header" style={{ padding: "0 32px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 80, position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 20, position: "relative", zIndex: 2 }}>
          <img src={LOGO} alt="NCD" style={{ height: 40, filter: "drop-shadow(0 1px 3px rgba(0,0,0,0.3))" }} />
          <div style={{ height: 32, width: 1, background: "rgba(255,255,255,0.2)" }}></div>
          <div>
            <div style={{ fontSize: "1.05rem", fontWeight: 700, color: "#fff", letterSpacing: "0.3px" }}>
              Operations <span style={{ color: "#EC8934" }}>Scrub Dashboard</span>
            </div>
          </div>
        </div>
        <div style={{ fontSize: "0.82rem", color: "rgba(255,255,255,0.6)", fontWeight: 500, position: "relative", zIndex: 2 }}>
          {new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}
        </div>
      </div>

      {/* Nav */}
      <div style={{ display: "flex", background: "#fff", borderBottom: "1px solid #e8ecf0", overflowX: "auto", padding: "0 24px", boxShadow: "0 1px 3px rgba(0,0,0,0.03)" }}>
        {tabs.map(function(t) {
          var active = tab === t.id || (tab === "drill" && drill && SECTIONS.some(function(s) { return s.id === t.id && s.id === drill.sec; }));
          return (
            <button key={t.id} onClick={function() { setTab(t.id); setDrill(null); }} style={{
              padding: "12px 18px", fontSize: "0.76rem", fontWeight: active ? 700 : 500,
              cursor: "pointer", border: "none", background: "none", fontFamily: "inherit",
              whiteSpace: "nowrap", color: active ? "#173963" : "#999",
              borderBottom: active ? "3px solid #EC8934" : "3px solid transparent",
              transition: "all 0.15s"
            }}>{t.label}</button>
          );
        })}
      </div>

      {/* Overview */}
      {tab === "overview" && (
        <div style={{ padding: "20px 0 40px" }}>
          {SECTIONS.map(function(sec) {
            return <SectionBlock key={sec.id} sec={sec} entries={entries} onDrill={handleDrill} />;
          })}
        </div>
      )}

      {/* Section Detail */}
      {SECTIONS.some(function(s) { return s.id === tab; }) && !drill && (
        <div style={{ padding: "20px 0 40px" }}>
          {(function() {
            var sec = SECTIONS.find(function(s) { return s.id === tab; });
            return <SectionBlock sec={sec} entries={entries} onDrill={handleDrill} />;
          })()}
        </div>
      )}

      {/* Drill-down */}
      {tab === "drill" && drill && (
        <DrillView drill={drill} entries={entries} onBack={function() { setTab("overview"); setDrill(null); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
